<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#252321"><meta name="description" content="Your private library for stories, manuscripts and story notes."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>My Story Library</title>
<style>
:root{--bg:#242321;--panel:#302e2a;--panel2:#393630;--cream:#eee7d9;--muted:#b7ad9c;--gold:#c7a66a;--gold2:#e0c38a;--line:#514b40;--ink:#28251f;--paper:#f4efe5;--shadow:0 12px 28px #0005}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#494238 0,#292724 42%,#201f1d 100%);color:var(--cream);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:1280px;margin:auto;min-height:100vh;padding:22px 22px 90px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.brand{font-family:Georgia,serif;color:var(--gold2);font-size:clamp(26px,4vw,38px);letter-spacing:.4px;text-shadow:0 2px 12px #0008}.subbrand{font-size:11px;letter-spacing:2.3px;text-transform:uppercase;color:var(--muted)}.top-actions{display:flex;gap:9px}.btn,.iconbtn{border:1px solid var(--line);background:#393630;color:var(--cream);padding:10px 14px;border-radius:10px}.btn.primary{background:linear-gradient(135deg,#d6b77b,#ad8950);color:#211e18;border:0;font-weight:700}.btn.ghost{background:transparent}.iconbtn{width:42px;height:42px;padding:0;font-size:18px}.filters{display:flex;gap:8px;overflow:auto;padding:3px 0 15px}.chip{white-space:nowrap;border:1px solid var(--line);background:#302e2a;color:var(--muted);padding:8px 14px;border-radius:999px}.chip.active{color:#211e18;background:var(--gold2);border-color:var(--gold2);font-weight:700}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0 14px}.section-head h2,.panel h2{font:22px Georgia,serif;color:var(--gold2);margin:0}.muted{color:var(--muted)}.shelf{background:linear-gradient(180deg,#4a3828,#392a20 65%,#241c17);border:1px solid #72563b;border-radius:14px;padding:22px 18px 12px;box-shadow:var(--shadow);position:relative;min-height:220px}.shelf:before{content:"";position:absolute;left:0;right:0;bottom:0;height:15px;background:linear-gradient(#8a6948,#513a28 55%,#2d2119);border-radius:0 0 13px 13px;box-shadow:0 7px 9px #0008}.books{display:flex;align-items:end;gap:12px;flex-wrap:wrap;min-height:175px;padding:4px 4px 14px}.book{height:158px;width:82px;border-radius:5px 7px 7px 3px;position:relative;display:flex;align-items:center;justify-content:center;box-shadow:inset 5px 0 7px #ffffff20,inset -4px 0 5px #0004,4px 5px 8px #0008;cursor:pointer;border:1px solid #ffffff25;transition:transform .18s}.book:hover{transform:translateY(-7px)}.book:before{content:"";position:absolute;left:8px;right:8px;top:12px;height:1px;background:#e5ca8b88;box-shadow:0 3px #0002}.book:after{content:"";position:absolute;left:8px;right:8px;bottom:12px;height:1px;background:#e5ca8b88}.book span{writing-mode:vertical-rl;transform:rotate(180deg);font: bold 13px Georgia,serif;letter-spacing:1px;color:#f1dcae;text-shadow:0 1px 2px #000;text-align:center;max-height:125px;overflow:hidden}.empty{padding:32px 10px;text-align:center;color:#d0c3ae}.empty strong{display:block;color:var(--gold2);font:20px Georgia,serif;margin-bottom:6px}.recent{display:flex;gap:12px;overflow:auto;padding-bottom:8px}.recent-card{min-width:190px;background:#302e2a;border:1px solid var(--line);border-radius:12px;padding:13px;cursor:pointer}.recent-card strong{display:block;color:var(--cream);margin-bottom:5px}.layout{display:grid;grid-template-columns:230px 1fr;gap:18px}.side{background:#292724;border:1px solid var(--line);border-radius:14px;padding:14px;height:max-content}.navbtn{display:block;width:100%;text-align:left;background:transparent;color:var(--muted);border:0;padding:11px;border-radius:8px}.navbtn.active,.navbtn:hover{background:#403a30;color:var(--gold2)}.panel{background:#302e2a;border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}.workspace-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}.cover-mini{width:65px;height:86px;border-radius:5px;background:linear-gradient(145deg,#6c4834,#2d2823);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--gold2);font:12px Georgia,serif;text-align:center;padding:7px}.tabs{display:flex;gap:7px;overflow:auto;border-bottom:1px solid var(--line);margin:14px 0 18px}.tab{background:transparent;color:var(--muted);border:0;padding:10px 13px;border-bottom:2px solid transparent;white-space:nowrap}.tab.active{color:var(--gold2);border-color:var(--gold)}.field{display:grid;gap:6px;margin:10px 0}.field label{color:var(--muted);font-size:13px}.field input,.field textarea,.field select{width:100%;background:#211f1c;color:var(--cream);border:1px solid var(--line);border-radius:8px;padding:11px}.field textarea{min-height:110px;resize:vertical}.editor{background:var(--paper);color:var(--ink);border-radius:10px;min-height:52vh;padding:22px;box-shadow:inset 0 0 0 1px #d5cbbb}.editor textarea{width:100%;min-height:48vh;border:0;outline:0;resize:vertical;background:transparent;color:var(--ink);font:17px/1.75 Georgia,serif}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.spacer{flex:1}.list{display:grid;gap:9px}.item{padding:13px;background:#252320;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;gap:10px}.item .grow{flex:1;min-width:0}.item strong{display:block}.small{font-size:12px;color:var(--muted)}.danger{color:#e5a19a}.hidden{display:none!important}.mobile-nav{display:none}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#eee7d9;color:#28251f;padding:10px 16px;border-radius:999px;box-shadow:var(--shadow);z-index:20}.modal-back{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:16px;z-index:10}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:#302e2a;border:1px solid #76664c;border-radius:16px;padding:22px;box-shadow:var(--shadow)}.modal h2{font:24px Georgia,serif;color:var(--gold2);margin:0 0 14px}.status{font-size:11px;color:#a8c9a7}.source-preview{width:100%;height:65vh;border:1px solid var(--line);border-radius:8px;background:#fff}.footer-note{text-align:center;color:#8f8779;font-size:11px;margin:28px 0 0}
@media(max-width:760px){.app{padding:16px 13px 88px}.layout{display:block}.side{display:none}.panel{padding:15px}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#211f1d;border-top:1px solid var(--line);justify-content:space-around;padding:8px 3px calc(8px + env(safe-area-inset-bottom));z-index:5}.mobile-nav button{border:0;background:transparent;color:var(--muted);font-size:11px;padding:5px}.mobile-nav button.active{color:var(--gold2)}.book{width:70px;height:140px}.books{gap:9px}.top{align-items:flex-start}.top-actions .btn{padding:9px 10px}.section-head h2{font-size:20px}}
</style></head><body><div class="app" id="app">
<header class="top"><div><div class="brand">My Story Library</div><div class="subbrand">A private home for your stories</div></div><div class="top-actions"><button class="iconbtn" id="searchBtn" aria-label="Search">⌕</button><button class="iconbtn" id="settingsBtn" aria-label="Settings">⚙</button></div></header>
<main id="main"></main><div class="footer-note">Your writing is stored on this device in this first-release prototype. Export regular backups.</div></div>
<nav class="mobile-nav"><button data-home="home" class="active">▤<br>Library</button><button data-home="import">⇧<br>Import</button><button data-home="notes">✎<br>Notes</button><button data-home="settings">⚙<br>Settings</button></nav>
<div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
<script>
(()=>{'use strict';
const DB='msl_db_v1',STORE='records';let db,stories=[],currentId=null,view='home',activeFilter='All Stories',activeTab='manuscript',searchTerm='',activeChapterId=null;
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const palette=['#6b3e3e','#35534b','#344b68','#765b35','#59456c','#3d5962','#744c31','#56513a'];
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id'});r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
function all(){return new Promise((res,rej)=>{let r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function put(x){return new Promise((res,rej)=>{let r=db.transaction(STORE,'readwrite').objectStore(STORE).put(x);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function del(id){return new Promise((res,rej)=>{let r=db.transaction(STORE,'readwrite').objectStore(STORE).delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()}
function toast(t){let e=$('#toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2400)}
function blankStory(title='Untitled Story'){let d=new Date().toISOString();return{id:uid(),type:'story',title,description:'',genre:['Other'],status:'Ideas & Drafts',coverColor:palette[Math.floor(Math.random()*palette.length)],created:d,updated:d,lastOpened:d,chapters:[{id:uid(),title:'Chapter 1',text:''}],characters:[],notes:[],sources:[],style:{pov:'',tense:'',dialogue:'',romance:'',descriptions:'',pacing:'',preferences:''},recent:[]}}
async function refresh(){stories=(await all()).filter(x=>x.type==='story');for(const s of stories){let changed=false;if(!Array.isArray(s.chapters)){s.chapters=[];changed=true}for(const c of s.chapters){if(typeof c.text!=='string'){c.text=Array.isArray(c.scenes)?c.scenes.map(sc=>sc.text||'').filter(Boolean).join('\n\n'):'';changed=true}if('scenes'in c){delete c.scenes;changed=true}}if(changed)await put(s)}if(currentId&&!activeChapterId){const s=stories.find(x=>x.id===currentId);activeChapterId=s?.chapters[0]?.id||null}render()}
function saveStory(){let s=stories.find(x=>x.id===currentId);if(s){s.updated=new Date().toISOString();put(s)}}
function date(v){return v?new Date(v).toLocaleDateString():''}
function filtered(){return stories.filter(s=>(activeFilter==='All Stories'||s.status===activeFilter)&&(!searchTerm||(s.title+' '+s.description+' '+s.genre.join(' ')).toLowerCase().includes(searchTerm.toLowerCase())))}
function render(){let m=$('#main');if(view==='home')m.innerHTML=homeHTML();else if(view==='workspace')m.innerHTML=workspaceHTML();else if(view==='import')m.innerHTML=importHTML();else if(view==='notes')m.innerHTML=notesHTML();else if(view==='settings')m.innerHTML=settingsHTML();bind()}
function homeHTML(){let list=filtered(),recent=[...stories].sort((a,b)=>b.lastOpened.localeCompare(a.lastOpened)).slice(0,4);return `<div class="row" style="justify-content:space-between"><div class="filters">${['All Stories','Ideas & Drafts','In Progress','Completed'].map(f=>`<button class="chip ${activeFilter===f?'active':''}" data-filter="${f}">${f}</button>`).join('')}</div><button class="btn primary" id="addStory">＋ Add New Story</button></div><div class="section-head"><h2>My Bookshelf</h2><span class="muted">${list.length} ${list.length===1?'story':'stories'}</span></div><section class="shelf"><div class="books">${list.length?list.map((s,i)=>`<div class="book" style="background:linear-gradient(90deg,#0005,${s.coverColor},#0003)" data-open="${s.id}" title="${esc(s.title)}"><span>${esc(s.title)}</span></div>`).join(''):`<div class="empty" style="width:100%"><strong>Your library is waiting for its first story</strong>Create a book or import one of your existing novels.</div>`}</div></section><div class="section-head" style="margin-top:25px"><h2>Recently Opened</h2><button class="btn ghost" id="galleryBtn">Cover Gallery</button></div><div class="recent">${recent.length?recent.map(s=>`<div class="recent-card" data-open="${s.id}"><strong>${esc(s.title)}</strong><span class="small">${esc(s.status)} · ${s.chapters.length} chapters</span><div class="small">Edited ${date(s.updated)}</div></div>`).join(''):`<div class="muted">Your recently opened books will appear here.</div>`}</div><div class="section-head" style="margin-top:25px"><h2>Quick Access</h2></div><div class="row"><button class="btn" data-goto="import">⇧ Import Books</button><button class="btn" data-goto="notes">✎ All Notes</button><button class="btn" data-goto="settings">⚙ Settings & Backup</button></div>`}
function workspaceHTML(){let s=stories.find(x=>x.id===currentId);if(!s){view='home';return homeHTML()}let tabs=['manuscript','story bible','notes','sources','details'];return `<div class="row" style="margin-bottom:14px"><button class="btn ghost" id="backHome">← Library</button><span class="spacer"></span><span class="status">● Saved locally</span></div><div class="panel"><div class="workspace-head"><div class="cover-mini" style="background:linear-gradient(145deg,${s.coverColor},#29231d)">${esc(s.title.slice(0,22))}</div><div class="grow"><h2>${esc(s.title)}</h2><div class="muted">${esc(s.status)} · ${s.chapters.length} chapters · ${wordCount(s)} words</div><div class="small">${esc(s.description)}</div></div><button class="btn" id="continueWriting">Continue Writing</button></div><div class="tabs">${tabs.map(t=>`<button class="tab ${activeTab===t?'active':''}" data-tab="${t}">${t==='story bible'?'Story Bible':t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div><div id="tabContent">${tabContent(s)}</div></div>`}
function wordCount(s){return s.chapters.reduce((n,c)=>n+((c.text||'').trim()?c.text.trim().split(/\s+/).length:0),0)}
function tabContent(s){if(activeTab==='manuscript')return manuscriptHTML(s);if(activeTab==='story bible')return bibleHTML(s);if(activeTab==='notes')return storyNotesHTML(s);if(activeTab==='sources')return sourcesHTML(s);return detailsHTML(s)}
function manuscriptHTML(s){if(!activeChapterId||!s.chapters.some(c=>c.id===activeChapterId))activeChapterId=s.chapters[0]?.id||null;return `<div class="row" style="justify-content:space-between;margin-bottom:12px"><div><strong>Manuscript</strong><div class="small">Your book, organised by chapters only</div></div><button class="btn primary" id="addChapter">＋ Add Chapter</button></div><div class="panel" style="margin-bottom:14px;padding:12px"><strong>Chapters</strong><div class="list" style="margin-top:9px">${s.chapters.length?s.chapters.map((c,i)=>`<button class="navbtn ${c.id===activeChapterId?'active':''}" style="display:flex;align-items:center;gap:8px" data-chapter="${c.id}"><span class="grow">${i+1}. ${esc(c.title)}</span><span class="small">${(c.text||'').trim()?c.text.trim().split(/\s+/).length:0} words</span></button>`).join(''):'<p class="muted">No chapters yet. Tap Add Chapter to begin.</p>'}</div></div><div id="editorArea">${editorHTML(s,activeChapterId)}</div>`}
function editorHTML(s,cid){let c=s.chapters.find(x=>x.id===cid);if(!c)return '<div class="panel"><p class="muted">Select a chapter or add a new one to begin writing.</p></div>';let i=s.chapters.findIndex(x=>x.id===c.id);return `<div class="row" style="margin-bottom:10px"><div class="grow"><strong>${esc(c.title)}</strong><div class="small" id="chapterWordCount">${(c.text||'').trim()?(c.text||'').trim().split(/\s+/).length:0} words</div></div><button class="btn" id="renameChapter" data-cid="${c.id}">Rename</button><button class="btn danger" id="deleteChapter" data-cid="${c.id}">Delete</button></div><div class="editor"><textarea id="chapterText" placeholder="Begin writing your chapter…">${esc(c.text||'')}</textarea></div><div class="row" style="margin-top:10px"><span class="small" id="saveState">Saved on this device</span><span class="spacer"></span><button class="btn" id="moveChapterUp" data-cid="${c.id}" ${i===0?'disabled':''}>↑ Move up</button><button class="btn" id="moveChapterDown" data-cid="${c.id}" ${i===s.chapters.length-1?'disabled':''}>↓ Move down</button></div>`}
function bibleHTML(s){return `<div class="row" style="justify-content:space-between"><div><strong>Characters</strong><div class="small">Your story's character profiles</div></div><button class="btn primary" id="addCharacter">＋ Character</button></div><div class="list" style="margin-top:14px">${s.characters.length?s.characters.map(ch=>`<div class="item"><div class="grow"><strong>${esc(ch.name)}</strong><div class="small">${esc(ch.role||'Character')} · ${esc(ch.occupation||'')}</div><div class="small">${esc(ch.description||'')}</div></div><button class="btn" data-edit-char="${ch.id}">Edit</button></div>`).join(''):'<p class="muted">No characters yet. Add your first character profile.</p>'}</div><div class="panel" style="margin-top:18px"><h2>Writing Style Profile</h2><div class="small">Story-specific preferences for your AI writing partner later.</div><div class="row" style="margin-top:10px"><span class="muted">POV: ${esc(s.style.pov||'Not set')}</span><span class="muted">Tense: ${esc(s.style.tense||'Not set')}</span></div><button class="btn" style="margin-top:10px" id="editStyle">Edit Writing Style</button></div>`}
function storyNotesHTML(s){return `<div class="row"><strong class="grow">Story Notes</strong><button class="btn primary" id="addNote">＋ New Note</button></div><div class="list" style="margin-top:12px">${s.notes.map(n=>`<div class="item"><div class="grow"><strong>${esc(n.title)}</strong><div class="small">${esc(n.text).slice(0,180)}</div></div><button class="btn" data-edit-note="${n.id}">Edit</button></div>`).join('')||'<p class="muted">No notes yet.</p>'}</div>`}
function sourcesHTML(s){return `<div class="row"><div class="grow"><strong>Original Sources</strong><div class="small">Uploaded files are kept separately from your manuscript.</div></div><button class="btn primary" id="addSource">＋ Add Source</button></div><div class="list" style="margin-top:12px">${s.sources.map(x=>`<div class="item"><div class="grow"><strong>${esc(x.name)}</strong><div class="small">${esc(x.kind)} · ${date(x.added)}</div></div><button class="btn" data-source="${x.id}">Open</button></div>`).join('')||'<p class="muted">No source documents yet.</p>'}</div>`}
function detailsHTML(s){return `<h2>Story Details</h2><div class="field"><label>Title</label><input id="detailTitle" value="${esc(s.title)}"></div><div class="field"><label>Short description</label><textarea id="detailDesc">${esc(s.description)}</textarea></div><div class="field"><label>Genre</label><input id="detailGenre" value="${esc(s.genre.join(', '))}"></div><div class="field"><label>Status</label><select id="detailStatus">${['Ideas & Drafts','In Progress','Completed','Archived'].map(x=>`<option ${s.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="row"><button class="btn primary" id="saveDetails">Save Details</button><button class="btn" id="exportStory">Export Story JSON</button><button class="btn danger" id="deleteStory">Delete Story</button></div>`}
function importHTML(){return `<div class="panel"><h2>Import Centre</h2><p class="muted">Bring your novels and notes from Google NotebookLM into My Story Library. Keep original documents safe while you review imported text.</p><div class="field"><label>Choose a story to import into (optional)</label><select id="importTarget"><option value="">Create a new story from each imported file</option>${stories.map(s=>`<option value="${s.id}">${esc(s.title)}</option>`).join('')}</select></div><div class="field"><label>Select Word, PDF, text or Markdown files</label><input id="importFiles" type="file" multiple accept=".docx,.pdf,.txt,.md,.markdown"></div><div class="row"><button class="btn primary" id="runImport">Import selected files</button><button class="btn" id="importHelp">NotebookLM export steps</button></div><div id="importResults" style="margin-top:14px"></div><div class="panel" style="margin-top:18px"><h2>NotebookLM tip</h2><ol class="muted"><li>Open your notebook in NotebookLM.</li><li>For a note or written chapter, use its menu and choose export to Google Docs where available.</li><li>In Google Docs, download as Microsoft Word (.docx) or PDF.</li><li>For long books, export chapters separately to preserve their structure.</li><li>Select the exported files above and import them here.</li></ol><p class="small">DOCX text is extracted for editing. PDF files are stored as original source documents in this first build; text extraction from PDFs will be added in the next import update. TXT and Markdown are imported directly.</p></div></div>`}
function notesHTML(){return `<div class="panel"><div class="row"><h2 class="grow">All Notes</h2><button class="btn primary" id="addGlobalNote">＋ New Note</button></div><div class="list" style="margin-top:14px">${stories.flatMap(s=>s.notes.map(n=>({s,n}))).map(({s,n})=>`<div class="item"><div class="grow"><strong>${esc(n.title)}</strong><div class="small">${esc(s.title)} · ${date(n.added)}</div></div><button class="btn" data-open="${s.id}" data-note-tab="1">Open</button></div>`).join('')||'<p class="muted">Notes from all your stories will appear here.</p>'}</div></div>`}
function settingsHTML(){return `<div class="panel"><h2>Settings & Backup</h2><p class="muted">First-release local storage controls.</p><div class="item"><div class="grow"><strong>Export complete library backup</strong><div class="small">Includes stories, chapters, Story Bible and notes. Original source files are exported separately in a future update.</div></div><button class="btn primary" id="backupBtn">Export JSON</button></div><div class="item"><div class="grow"><strong>Import library backup</strong><div class="small">Restore a previously exported JSON backup.</div></div><input id="restoreFile" type="file" accept=".json,application/json" style="max-width:150px"></div><div class="item"><div class="grow"><strong>Install on Android</strong><div class="small">When hosted on a secure HTTPS address, open in Chrome and choose Install app / Add to Home screen.</div></div></div><div class="item"><div class="grow"><strong>Storage</strong><div class="small">Your stories are saved in this browser on this device. Export backups regularly.</div></div></div></div>`}
function modal(title,body,saveText='Save',onSave){let root=$('#modalRoot');root.innerHTML=`<div class="modal-back"><div class="modal"><div class="row"><h2 class="grow">${title}</h2><button class="iconbtn" id="closeModal">×</button></div>${body}<div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" id="cancelModal">Cancel</button><button class="btn primary" id="saveModal">${saveText}</button></div></div></div>`;$('#closeModal').onclick=$('#cancelModal').onclick=()=>root.innerHTML='';$('#saveModal').onclick=async()=>{await onSave?.();root.innerHTML='';await refresh()}}
function bind(){document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{activeFilter=b.dataset.filter;render()});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openStory(b.dataset.open,b.dataset.noteTab));document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>go(b.dataset.goto));$('#addStory')?.addEventListener('click',()=>modal('Create a Story',`<div class="field"><label>Story title</label><input id="newTitle" placeholder="Enter your story title" autofocus></div><div class="field"><label>Short description (optional)</label><textarea id="newDesc"></textarea></div><div class="field"><label>Genre</label><input id="newGenre" placeholder="Romance, Suspense, etc."></div>`, 'Create Story',async()=>{let s=blankStory($('#newTitle').value.trim()||'Untitled Story');s.description=$('#newDesc').value;s.genre=$('#newGenre').value.split(',').map(x=>x.trim()).filter(Boolean);await put(s);currentId=s.id;view='workspace';activeTab='manuscript'}));$('#galleryBtn')?.addEventListener('click',()=>toast('Cover Gallery view will be added in the next visual build.'));$('#backHome')?.addEventListener('click',()=>{view='home';currentId=null;render()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;render()});$('#continueWriting')?.addEventListener('click',()=>{activeTab='manuscript';render()});
if($('#chapterText')){$('#chapterText').addEventListener('input',()=>{let s=stories.find(x=>x.id===currentId),c=s.chapters.find(x=>x.id===activeChapterId);if(!c)return;c.text=$('#chapterText').value;s.updated=new Date().toISOString();let wc=c.text.trim()?c.text.trim().split(/\s+/).length:0;$('#saveState').textContent='Saving…';$('#chapterWordCount').textContent=wc+' words';put(s).then(()=>$('#saveState').textContent='Saved on this device · '+wc+' words')})}
$('#addChapter')?.addEventListener('click',async()=>{let s=stories.find(x=>x.id===currentId),c={id:uid(),title:'Chapter '+(s.chapters.length+1),text:''};s.chapters.push(c);activeChapterId=c.id;await put(s);render()});document.querySelectorAll('[data-chapter]').forEach(b=>b.onclick=()=>{activeChapterId=b.dataset.chapter;render()});$('#renameChapter')?.addEventListener('click',()=>{let s=stories.find(x=>x.id===currentId),c=s.chapters.find(x=>x.id===$('#renameChapter').dataset.cid);modal('Rename Chapter',`<div class="field"><label>Chapter title</label><input id="renameValue" value="${esc(c.title)}"></div>`,'Save Chapter',async()=>{c.title=$('#renameValue').value.trim()||c.title;await put(s)})});$('#deleteChapter')?.addEventListener('click',async()=>{let s=stories.find(x=>x.id===currentId),id=$('#deleteChapter').dataset.cid,c=s.chapters.find(x=>x.id===id);if(!c)return;if(!confirm('Delete “'+c.title+'” and all of its text? This cannot be undone. Export a backup first if you may need it.'))return;s.chapters=s.chapters.filter(x=>x.id!==id);activeChapterId=s.chapters[0]?.id||null;await put(s);toast('Chapter deleted.');render()});$('#moveChapterUp')?.addEventListener('click',async()=>{let s=stories.find(x=>x.id===currentId),i=s.chapters.findIndex(x=>x.id===activeChapterId);if(i>0){[s.chapters[i-1],s.chapters[i]]=[s.chapters[i],s.chapters[i-1]];await put(s);render()}});$('#moveChapterDown')?.addEventListener('click',async()=>{let s=stories.find(x=>x.id===currentId),i=s.chapters.findIndex(x=>x.id===activeChapterId);if(i>=0&&i<s.chapters.length-1){[s.chapters[i+1],s.chapters[i]]=[s.chapters[i],s.chapters[i+1]];await put(s);render()}});
$('#addCharacter')?.addEventListener('click',()=>characterModal());document.querySelectorAll('[data-edit-char]').forEach(b=>b.onclick=()=>characterModal(b.dataset.editChar));$('#editStyle')?.addEventListener('click',()=>styleModal());$('#addNote')?.addEventListener('click',()=>noteModal());$('#addGlobalNote')?.addEventListener('click',()=>{if(!stories.length){toast('Create a story first.');return}currentId=stories[0].id;noteModal()});document.querySelectorAll('[data-edit-note]').forEach(b=>b.onclick=()=>noteModal(b.dataset.editNote));$('#addSource')?.addEventListener('click',()=>{let inp=document.createElement('input');inp.type='file';inp.accept='.docx,.pdf,.txt,.md';inp.onchange=()=>saveSource(inp.files[0]);inp.click()});document.querySelectorAll('[data-source]').forEach(b=>b.onclick=()=>openSource(b.dataset.source));$('#saveDetails')?.addEventListener('click',async()=>{let s=stories.find(x=>x.id===currentId);s.title=$('#detailTitle').value;s.description=$('#detailDesc').value;s.genre=$('#detailGenre').value.split(',').map(x=>x.trim()).filter(Boolean);s.status=$('#detailStatus').value;await put(s);toast('Story details saved.');render()});$('#exportStory')?.addEventListener('click',()=>downloadJSON(stories.find(x=>x.id===currentId),stories.find(x=>x.id===currentId).title+'.json'));$('#deleteStory')?.addEventListener('click',()=>{if(confirm('Delete this story from this device? Export a backup first if you may need it.'))del(currentId).then(()=>{currentId=null;view='home';refresh()})});$('#runImport')?.addEventListener('click',runImport);$('#importHelp')?.addEventListener('click',()=>alert('In NotebookLM, export your notes to Google Docs. In Google Docs choose File → Download → Microsoft Word (.docx) or PDF. Then select the downloaded files here.'));$('#backupBtn')?.addEventListener('click',async()=>downloadJSON({format:'My Story Library backup',version:1,exported:new Date().toISOString(),stories},'my-story-library-backup.json'));$('#restoreFile')?.addEventListener('change',restoreBackup);$('#searchBtn').onclick=()=>{let q=prompt('Search your library');if(q!==null){searchTerm=q;view='home';render()}};$('#settingsBtn').onclick=()=>go('settings');document.querySelectorAll('.mobile-nav button').forEach(b=>b.onclick=()=>go(b.dataset.home));}
function characterModal(id){let s=stories.find(x=>x.id===currentId),ch=s.characters.find(x=>x.id===id)||{id:uid(),name:'',role:'Main',occupation:'',description:'',appearance:'',personality:'',background:'',relationships:''};modal(id?'Edit Character':'New Character',`<div class="field"><label>Name</label><input id="chName" value="${esc(ch.name)}"></div><div class="field"><label>Role</label><select id="chRole">${['Main','Supporting','Minor','Antagonist'].map(x=>`<option ${ch.role===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Occupation / lifestyle</label><input id="chOcc" value="${esc(ch.occupation)}"></div><div class="field"><label>Appearance</label><textarea id="chAppearance">${esc(ch.appearance)}</textarea></div><div class="field"><label>Personality and mannerisms</label><textarea id="chPersonality">${esc(ch.personality)}</textarea></div><div class="field"><label>Background</label><textarea id="chBackground">${esc(ch.background)}</textarea></div><div class="field"><label>Relationships</label><textarea id="chRelationships">${esc(ch.relationships)}</textarea></div><div class="field"><label>Other description / notes</label><textarea id="chDescription">${esc(ch.description)}</textarea></div>`,'Save Character',async()=>{ch.name=$('#chName').value;ch.role=$('#chRole').value;ch.occupation=$('#chOcc').value;ch.appearance=$('#chAppearance').value;ch.personality=$('#chPersonality').value;ch.background=$('#chBackground').value;ch.relationships=$('#chRelationships').value;ch.description=$('#chDescription').value;if(!id)s.characters.push(ch);await put(s)})}
function styleModal(){let s=stories.find(x=>x.id===currentId),p=s.style;modal('Writing Style Profile',`<div class="field"><label>Point of view</label><input id="styPov" value="${esc(p.pov)}" placeholder="First / third person, single / dual POV"></div><div class="field"><label>Tense</label><input id="styTense" value="${esc(p.tense)}" placeholder="Past / present"></div><div class="field"><label>Dialogue style</label><input id="styDialogue" value="${esc(p.dialogue)}"></div><div class="field"><label>Romance & emotion</label><input id="styRomance" value="${esc(p.romance)}"></div><div class="field"><label>Descriptions</label><input id="styDescriptions" value="${esc(p.descriptions)}"></div><div class="field"><label>Pacing</label><input id="styPacing" value="${esc(p.pacing)}"></div><div class="field"><label>Personal preferences</label><textarea id="styPreferences">${esc(p.preferences)}</textarea></div>`,'Save Profile',async()=>{s.style={pov:$('#styPov').value,tense:$('#styTense').value,dialogue:$('#styDialogue').value,romance:$('#styRomance').value,descriptions:$('#styDescriptions').value,pacing:$('#styPacing').value,preferences:$('#styPreferences').value};await put(s)})}
function noteModal(id){let s=stories.find(x=>x.id===currentId),n=s.notes.find(x=>x.id===id)||{id:uid(),title:'',text:'',added:new Date().toISOString()};modal(id?'Edit Note':'New Note',`<div class="field"><label>Title</label><input id="noteTitle" value="${esc(n.title)}"></div><div class="field"><label>Note</label><textarea id="noteText" style="min-height:180px">${esc(n.text)}</textarea></div>`,'Save Note',async()=>{n.title=$('#noteTitle').value||'Untitled Note';n.text=$('#noteText').value;if(!id)s.notes.unshift(n);await put(s)})}
async function saveSource(file){if(!file)return;let s=stories.find(x=>x.id===currentId);let rec={id:uid(),name:file.name,kind:file.type||file.name.split('.').pop().toUpperCase(),added:new Date().toISOString(),blob:file};s.sources.push(rec);await put(s);toast('Original source saved to this device.');render()}
function openSource(id){let s=stories.find(x=>x.id===currentId),src=s.sources.find(x=>x.id===id);if(!src)return;let url=URL.createObjectURL(src.blob);let isPdf=src.name.toLowerCase().endsWith('.pdf');let root=$('#modalRoot');root.innerHTML=`<div class="modal-back"><div class="modal" style="width:min(900px,100%)"><div class="row"><h2 class="grow">${esc(src.name)}</h2><button class="iconbtn" id="closeSource">×</button></div>${isPdf?`<iframe class="source-preview" src="${url}"></iframe>`:`<p class="muted">This original file is safely stored. Download it to open in a compatible app.</p><button class="btn primary" id="downloadSource">Download original</button>`}</div></div>`;$('#closeSource').onclick=()=>{root.innerHTML='';URL.revokeObjectURL(url)};$('#downloadSource')?.addEventListener('click',()=>{let a=document.createElement('a');a.href=url;a.download=src.name;a.click()})}
async function runImport(){let files=[...($('#importFiles').files||[])];if(!files.length){toast('Choose one or more files first.');return}let target=$('#importTarget').value,results=[];for(let f of files){let ext=f.name.split('.').pop().toLowerCase();if(target){let s=stories.find(x=>x.id===target);if(ext==='txt'||ext==='md'||ext==='markdown'||ext==='docx'){let text=await extractText(f,ext);appendImported(s,f.name,text);results.push('Imported editable text: '+f.name)}else{await saveFileAsSource(s,f);results.push('Saved original PDF source: '+f.name)}}else{let s=blankStory(f.name.replace(/\.[^.]+$/,''));if(ext==='txt'||ext==='md'||ext==='markdown'||ext==='docx'){let text=await extractText(f,ext);s.chapters=[{id:uid(),title:'Imported Manuscript',text}];s.status='In Progress'}else{await saveFileAsSource(s,f)}await put(s);results.push('Created story: '+s.title)} }$('#importResults').innerHTML=`<div class="item"><div><strong>Import results</strong>${results.map(x=>`<div class="small">✓ ${esc(x)}</div>`).join('')}</div></div>`;await refresh()}
function appendImported(s,name,text){let c={id:uid(),title:name.replace(/\.[^.]+$/,''),text};s.chapters.push(c);s.status='In Progress';put(s)}
async function saveFileAsSource(s,f){s.sources.push({id:uid(),name:f.name,kind:f.type||f.name.split('.').pop().toUpperCase(),added:new Date().toISOString(),blob:f});await put(s)}
async function extractText(f,ext){if(ext==='txt'||ext==='md'||ext==='markdown')return await f.text();if(ext==='docx')return await docxText(await f.arrayBuffer());return ''}
async function docxText(buf){try{let u=new Uint8Array(buf),view=new DataView(buf),eocd=-1;for(let i=u.length-22;i>=Math.max(0,u.length-65558);i--){if(view.getUint32(i,true)===0x06054b50){eocd=i;break}}if(eocd<0)throw Error('Invalid DOCX zip');let count=view.getUint16(eocd+10,true),p=view.getUint32(eocd+16,true),data=null;for(let i=0;i<count;i++){if(view.getUint32(p,true)!==0x02014b50)break;let method=view.getUint16(p+10,true),cs=view.getUint32(p+20,true),nl=view.getUint16(p+28,true),el=view.getUint16(p+30,true),cl=view.getUint16(p+32,true),off=view.getUint32(p+42,true),name=new TextDecoder().decode(u.slice(p+46,p+46+nl));if(name==='word/document.xml'){let nlen=view.getUint16(off+26,true),elen=view.getUint16(off+28,true),start=off+30+nlen+elen,raw=u.slice(start,start+cs);if(method===0)data=raw;else if(method===8){let ds=new DecompressionStream('deflate-raw');data=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(ds)).arrayBuffer())}break}p+=46+nl+el+cl}if(!data)throw Error('Word document text not found');let xml=new DOMParser().parseFromString(new TextDecoder().decode(data),'application/xml');return [...xml.getElementsByTagName('w:p')].map(p=>[...p.getElementsByTagName('w:t')].map(t=>t.textContent).join('')).join('\n\n')}catch(e){throw new Error('Could not read this DOCX file in this browser. Please export it as TXT or try another DOCX file. '+e.message)}}
function downloadJSON(obj,name){let blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
async function restoreBackup(e){let f=e.target.files[0];if(!f)return;try{let j=JSON.parse(await f.text());let arr=Array.isArray(j)?j:j.stories;if(!Array.isArray(arr))throw Error('Not a library backup');if(!confirm('Import '+arr.length+' stories? Existing stories with the same IDs will be replaced.'))return;for(let s of arr){if(!s.id)s.id=uid();s.type='story';await put(s)}toast('Backup imported.');await refresh()}catch(err){alert('Could not import backup: '+err.message)}}
function openStory(id,noteTab){currentId=id;let s=stories.find(x=>x.id===id);s.lastOpened=new Date().toISOString();activeChapterId=s.chapters[0]?.id||null;put(s);view='workspace';activeTab=noteTab?'notes':'manuscript';render()}
function go(v){view=v;render();document.querySelectorAll('.mobile-nav button').forEach(b=>b.classList.toggle('active',b.dataset.home===v))}
openDB().then(refresh).catch(e=>{console.error(e);$('#main').innerHTML='<div class="panel">This browser does not support local storage required by My Story Library.</div>'});
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(console.warn);
})();
</script></body></html>
